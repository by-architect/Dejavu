buildscript {
    repositories {
        gradle.configureMavenRepositories(delegate)
    }

    dependencies {
        classpath libs.mozilla.glean.gradle.plugin
    }
}

plugins {
    id 'com.android.library'
    alias(libs.plugins.dependency.analysis)
}

android {
    defaultConfig {
        buildConfigField("String", "LIBRARY_VERSION", "\"" + config.componentsVersion + "\"")
    }

    buildFeatures {
        buildConfig = true
    }

    namespace = 'mozilla.components.lib.integrity.googleplay'
}

// Dejavu: the Play Integrity API lives in proprietary.gradle, which F-Droid's recipe deletes.
// Without it this module compiles src/foss/java, which keeps the same API and issues no tokens.
if (file('proprietary.gradle').exists()) {
    apply from: 'proprietary.gradle'
} else {
    android.sourceSets.main.kotlin.srcDirs += 'src/foss/java'
}

dependencies {
    implementation project(':components:concept-integrity')

    // We only compile against Glean. It's up to the app to add those dependencies
    // if it wants to collect GeckoView telemetry through the Glean SDK.
    compileOnly libs.mozilla.glean


    testImplementation project(':components:support-test')
    testImplementation libs.androidx.test.junit
    testImplementation libs.kotlin.test
    testImplementation libs.kotlinx.coroutines.test
    testImplementation libs.androidx.work.testing
    testImplementation libs.mozilla.glean
    testImplementation libs.mozilla.glean.forUnitTests
    testImplementation libs.robolectric
}

ext {
    gleanNamespace = "mozilla.telemetry.glean"
    gleanPythonEnvDir = gradle.mozconfig.substs.GRADLE_GLEAN_PARSER_VENV
}
apply plugin: "org.mozilla.telemetry.glean-gradle-plugin"
apply from: '../../../common-config.gradle'
apply from: '../../../publish.gradle'
ext.configurePublish(config.componentsGroupId, project.name, project.ext.description)

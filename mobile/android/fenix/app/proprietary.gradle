// Dejavu: every dependency here is closed source, so F-Droid will not build an app that declares
// them. Its recipe deletes this file before it scans the tree; build.gradle then compiles
// src/foss/java in place of src/proprietary/java, which holds stand-ins that do nothing.
//
// Keeping the coordinates out of build.gradle is the point: F-Droid's scanner reads the text of the
// build files, so moving a dependency to another configuration would not have hidden it.

def catalog = project.extensions.getByType(org.gradle.api.artifacts.VersionCatalogsExtension).named('libs')

android {
    sourceSets.main.java.srcDirs += 'src/proprietary/java'
}

dependencies {
    // Google Play install referrer, for the UTM parameters of a Play Store install.
    implementation catalog.findLibrary('installreferrer').get()
    // Google Play in-app review.
    implementation catalog.findLibrary('play-review').get()
    implementation catalog.findLibrary('play-review-ktx').get()
}

# Puts new bug reports and feature requests on the Dejavu Roadmap board
# (https://github.com/users/by-architect/projects/1), in the Bugs or Features column by the label their issue
# template adds, tagged Waiting. Issues already on the board are left where they are, so moving a card by hand sticks.

name: Roadmap

on:
  issues:
    types: [opened, labeled]

permissions: {}

concurrency:
  group: roadmap-${{ github.event.issue.number }}

jobs:
  add-to-roadmap:
    if: github.repository == 'by-architect/Dejavu'
    runs-on: ubuntu-latest
    steps:
      - name: Add the issue to its roadmap column
        env:
          GH_TOKEN: ${{ secrets.ROADMAP_TOKEN }}
          ISSUE_ID: ${{ github.event.issue.node_id }}
          LABELS: ${{ toJSON(github.event.issue.labels.*.name) }}
          PROJECT_ID: PVT_kwHOBaPFa84BlT8L
          COLUMN_FIELD: PVTSSF_lAHOBaPFa84BlT8LzhkBTNU
          PROGRESS_FIELD: PVTSSF_lAHOBaPFa84BlT8LzhkBYfA
          WAITING: db07db17
        run: |
          column=$(jq -r '
            if index("bug") then "473f50f4"
            elif index("enhancement") then "9ea8f76a"
            else empty end' <<< "$LABELS")
          if [ -z "$column" ]; then
            echo "No roadmap label on this issue."
            exit 0
          fi

          on_board=$(gh api graphql -f query='query($id: ID!) { node(id: $id) { ... on Issue {
              projectItems(first: 20) { nodes { project { id } } } } } }' -f id="$ISSUE_ID" \
            --jq "[.data.node.projectItems.nodes[] | select(.project.id == \"$PROJECT_ID\")] | length")
          if [ "$on_board" != "0" ]; then
            echo "The issue is already on the roadmap."
            exit 0
          fi

          item=$(gh api graphql -f query='mutation($project: ID!, $issue: ID!) {
              addProjectV2ItemById(input: {projectId: $project, contentId: $issue}) { item { id } } }' \
            -f project="$PROJECT_ID" -f issue="$ISSUE_ID" --jq '.data.addProjectV2ItemById.item.id')

          set_option() {
            gh api graphql -f query='mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
                updateProjectV2ItemFieldValue(input: {projectId: $project, itemId: $item, fieldId: $field,
                  value: {singleSelectOptionId: $option}}) { projectV2Item { id } } }' \
              -f project="$PROJECT_ID" -f item="$item" -f field="$1" -f option="$2" > /dev/null
          }
          set_option "$COLUMN_FIELD" "$column"
          set_option "$PROGRESS_FIELD" "$WAITING"
          echo "Added to the roadmap."

# Draws the Dejavu Roadmap board (https://github.com/users/by-architect/projects/1) as roadmap.svg, and the star
# history as stars.svg and stars-dark.svg, on the `roadmap` branch, which the README shows. Moving a card on the board
# starts no workflow, so besides issue changes it also runs every hour. The branch only ever holds the latest pictures,
# so main gets no commits from it.

name: Roadmap image

on:
  issues:
    types: [opened, edited, closed, reopened, deleted, transferred, labeled, unlabeled]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: roadmap-image

jobs:
  draw:
    if: github.repository == 'by-architect/Dejavu'
    runs-on: ubuntu-latest
    steps:
      - name: Draw the board
        env:
          GH_TOKEN: ${{ secrets.ROADMAP_TOKEN }}
        run: |
          curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/.github/scripts/roadmap_image.py" \
            -o "$RUNNER_TEMP/roadmap_image.py"
          mkdir -p "$RUNNER_TEMP/roadmap"
          python3 "$RUNNER_TEMP/roadmap_image.py" > "$RUNNER_TEMP/roadmap/roadmap.svg"

      - name: Draw the star history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/.github/scripts/star_history.py" \
            -o "$RUNNER_TEMP/star_history.py"
          python3 "$RUNNER_TEMP/star_history.py" light > "$RUNNER_TEMP/roadmap/stars.svg"
          python3 "$RUNNER_TEMP/star_history.py" dark > "$RUNNER_TEMP/roadmap/stars-dark.svg"

      - name: Publish it on the roadmap branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/roadmap"
          changed=no
          for file in roadmap.svg stars.svg stars-dark.svg; do
            if ! curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/roadmap/$file" -o "$RUNNER_TEMP/old.svg" \
              || ! cmp -s "$RUNNER_TEMP/old.svg" "$file"; then
              changed=yes
            fi
          done
          if [ "$changed" = no ]; then
            echo "Nothing changed."
            exit 0
          fi
          git init -q -b roadmap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add roadmap.svg stars.svg stars-dark.svg
          git commit -qm "Draw the roadmap board and star history"
          git push -qf "https://x-access-token:$GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY.git" HEAD:roadmap
          echo "Published the new pictures."

name: Design, icons or themes
description: Contribute a design, an icon pack, a theme or other artwork to Dejavu.
title: "[DESIGN] "
labels: ["design"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping with Dejavu's design, it is where we need help the most. You do not need to write code: images, SVG files or a link to your mockups are enough to start. [CONTRIBUTING.md](https://github.com/by-architect/Dejavu/blob/main/CONTRIBUTING.md#design-icon-packs-and-themes) explains how icons and themes are made in Dejavu.

        Keep `[DESIGN]` at the start of the title and add a short summary after it, for example `[DESIGN] Rounded icon pack`.
  - type: dropdown
    id: kind
    attributes:
      label: What would you like to contribute?
      multiple: true
      options:
        - Icon pack or icons
        - App icon
        - Workspace themes or colors
        - Screens or flows (UI and UX)
        - Illustrations or store graphics
        - Something else
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe it
      description: What it is, which screens or icons it covers, and the idea behind it.
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Files or links
      description: Drag images here, or link to Figma or other files. SVG is best for icons.
  - type: checkboxes
    id: rights
    attributes:
      label: Rights
      options:
        - label: I made this work, or I have the right to share it, and I agree to license it under the Mozilla Public License 2.0 like the rest of Dejavu.
          required: true

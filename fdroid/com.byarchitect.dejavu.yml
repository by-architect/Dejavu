Name: Dejavu

RepoType: git
Repo: https://github.com/by-architect/Dejavu.git

Builds:
  - versionName: 1.0.0
    versionCode: 2016200000
    commit: abe13cd4e21479ff000640a02c33492b294a5755
    output: 
      objdir-fdroid/gradle/build/mobile/android/fenix/app/outputs/apk/release/app-release-unsigned.apk
    scandelete:
      - config/tests/test.manifest.jar
      - dom/base/test/file_bug945152.jar
      - dom/security/test/cors/file_CrossSiteXHR_inner.jar
      - modules/libjar/test/unit/data/test_1801102.jar
      - modules/libjar/test/unit/data/test_bug370103.jar
      - third_party/application-services/components/support/nimbus-fml/fixtures/android/runtime/json.jar
      - third_party/chromium/build/android/java/test/missing_symbol/c.jar
      - third_party/chromium/build/android/stacktrace/java_deobfuscate_java.jar
      - third_party/chromium/build/android/tests/symbolize/liba.so
      - third_party/chromium/build/android/tests/symbolize/libb.so
      - third_party/libwebrtc/examples/androidapp/third_party/autobanh/lib/autobanh.jar
    build:
      - export MOZCONFIG=$PWD/fdroid/mozconfig
      - ./mach --no-interactive bootstrap --application-choice mobile_android
      - ./mach build
      - ./mach gradle fenix:assembleRelease -PversionName=1.0.0 -PversionCode=2016200000
        -PdisableDebugSigning

MaintainerNotes: |-
  Dejavu is a Fenix fork that carries the whole mozilla-central tree, so GeckoView is compiled from
  source rather than taken from a Maven artifact. The build needs the NDK this tree pins in
  python/mozboot/mozboot/android.py (r30) plus rust, clang, node and wasi-sdk, which
  `mach bootstrap` fetches.

  Version code scheme: 2016190000 + major * 10000 + minor * 100 + patch, computed in
  mobile/android/fenix/app/build.gradle. 1.0.0 is therefore 2016200000. One CPU architecture is
  built per run; fdroid/mozconfig takes it from DEJAVU_FDROID_TARGET and defaults to arm64-v8a.

  UpdateCheckMode is None because Tags makes checkupdates scan every AndroidManifest.xml in the
  tree; mozilla-central has hundreds of them in tests and it cannot tell which one is the app.

AutoUpdateMode: None
UpdateCheckMode: None
CurrentVersion: 1.0.0
CurrentVersionCode: 2016200000

# Draft of the metadata/com.byarchitect.dejavu.yml entry for https://gitlab.com/fdroid/fdroiddata
#
# This is NOT ready to submit. Read README.md beside this file first: Dejavu still links several
# closed-source libraries that F-Droid does not accept, and the build below has never been run end to
# end. Lines marked "CHECK" are the ones to settle before opening a merge request.

Categories:
  - Internet
License: MPL-2.0
AuthorName: by-architect
WebSite: https://github.com/by-architect/Dejavu
SourceCode: https://github.com/by-architect/Dejavu
IssueTracker: https://github.com/by-architect/Dejavu/issues
Changelog: https://github.com/by-architect/Dejavu/releases

AutoName: Dejavu

RepoType: git
Repo: https://github.com/by-architect/Dejavu.git

Builds:
  - versionName: 1.0.0
    # build.gradle computes this as DEJAVU_VERSION_CODE_BASE + major * 10000 + minor * 100 + patch.
    versionCode: 2016200000
    # CHECK: the full commit hash of the v1.0.0 tag, once that tag exists and is pushed.
    commit: 0000000000000000000000000000000000000000

    # CHECK: a Gecko build takes hours, far past F-Droid's usual limit. Agree a value with the
    # maintainers on the merge request rather than assuming this one is accepted.
    timeout: 172800

    # Test fixtures that ship as binaries in the tree. None of them reach the APK, and the scanner
    # rejects the build while they are there.
    scandelete:
      - config/tests/test.manifest.jar
      - dom/base/test/file_bug945152.jar
      - dom/security/test/cors/file_CrossSiteXHR_inner.jar
      - modules/libjar/test/unit/data/test_1801102.jar
      - modules/libjar/test/unit/data/test_bug370103.jar
      - third_party/application-services/components/support/nimbus-fml/fixtures/android/runtime/json.jar
      - third_party/chromium/build/android/CheckInstallApk-debug.apk
      - third_party/chromium/build/android/chromium-debug.keystore
      - third_party/chromium/build/android/java/test/missing_symbol/c.jar
      - third_party/chromium/build/android/stacktrace/java_deobfuscate_java.jar
      - third_party/chromium/build/android/tests/symbolize/liba.so
      - third_party/chromium/build/android/tests/symbolize/libb.so
      - third_party/libwebrtc/examples/androidapp/third_party/autobanh/lib/autobanh.jar

    build:
      - export MOZCONFIG=$PWD/fdroid/mozconfig
      # CHECK: mach bootstrap fetches Mozilla's own clang, rust, NDK, node and wasi-sdk builds. They
      # are the toolchain this source is meant to be built with, but they are downloaded binaries, so
      # raise it with the reviewer before submitting. Building them from source instead is what
      # IronFox does and it makes the build far longer.
      - ./mach --no-interactive bootstrap --application-choice mobile_android
      - ./mach build
      - ./mach gradle fenix:assembleRelease -PversionName=1.0.0 -PversionCode=2016200000 -PdisableDebugSigning

    output: objdir-fdroid/gradle/build/mobile/android/fenix/app/outputs/apk/release/app-release-unsigned.apk

# F-Droid builds and signs this itself, so a new tag needs its Builds entry added by hand. That is
# what store-submit.sh does on each release.
AutoUpdateMode: None
UpdateCheckMode: Tags
CurrentVersion: 1.0.0
CurrentVersionCode: 2016200000

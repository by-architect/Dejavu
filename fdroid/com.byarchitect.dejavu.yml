MaintainerNotes: |-
  Dejavu is a Fenix fork that carries the whole mozilla-central tree, so GeckoView is compiled from
  source rather than taken from a Maven artifact. The build needs the NDK this tree pins in
  python/mozboot/mozboot/android.py (r30) plus rust, clang, node and wasi-sdk, which
  `mach bootstrap` fetches.

  Version code scheme: 2016190000 + major * 10000 + minor * 100 + patch, computed in
  mobile/android/fenix/app/build.gradle. 1.0.0 is therefore 2016200000. One CPU architecture is
  built per run; fdroid/mozconfig takes it from DEJAVU_FDROID_TARGET and defaults to arm64-v8a.

  The prebuild deletions are test suites and the Windows and macOS halves of the tree; none of them
  are reachable from an Android build, which also configures with --disable-tests. The scanignore
  paths cannot be deleted instead: third_party/rust, third_party/python and
  third_party/application-services are vendored with cargo checksums, so removing a file inside them
  breaks the build; toolkit/components/pdfjs/content/web/wasm holds the JBIG2, OpenJPEG and qcms
  decoders pdf.js ships in the app; services/settings/dumps holds the Remote Settings dumps. Between
  them they account for all 3585 file findings the scanner reported.

  Focus, the GeckoView example and the component samples are removed and fdroid/mozconfig limits the
  Gradle build to the Dejavu subproject, so the dependencies of the other apps sharing this tree are
  not counted against it.

  The app's Google Play libraries - install referrer and in-app review - and its dependency on
  lib-push-firebase live in mobile/android/fenix/app/proprietary.gradle, which this recipe deletes.
  Without that file the app compiles src/foss/java instead of src/proprietary/java, whose stand-ins
  keep the same API and do nothing. Firebase push is inert in Dejavu either way: web push needs a
  Firebase project id and the app ships none.

  lib-push-firebase's and lib-llm-gemininano's own dependencies are dropped rather than ignored. Nothing in Dejavu reaches
  that component, so Gradle never compiles it and the library never reaches the APK.

  Four of the scanignore entries are not binaries. build.gradle, publish.gradle and
  substitute-local-geckoview.gradle declare the maven repository inside the object directory that an
  in-tree Gecko build publishes to and consumes; it is local to the build, not a remote. GeckoLoader
  uses DexClassLoader to load GeckoView's own code out of the APK it is already part of.
  mobile/android/geckoview/build.gradle is deliberately NOT ignored, because it also pulls in
  play-services-fido, which still has to go.

  UpdateCheckMode is None because Tags makes checkupdates scan every AndroidManifest.xml in the
  tree; mozilla-central has hundreds of them in tests and it cannot tell which one is the app.

AutoUpdateMode: None
